name: CI

on:
  push:
  pull_request:

jobs:
  agent:
    name: Agent (tests + simulator smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m pip install -r agent/requirements.txt
          cd agent && python -m unittest -v test_engine
      - name: Start with ./start.sh and query the API
        run: |
          ./start.sh --key ci > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/status >/dev/null && break; sleep 1; done
          curl -fsS localhost:8080/api/beacon
          curl -fsS -X POST localhost:8080/api/sim -H 'Content-Type: application/json' -d '{"scenario":"service"}'
          sleep 1
          curl -fsS localhost:8080/api/beacon | grep -q '"o":2'
          curl -fsS -X POST "localhost:8080/api/fix?from=ci" -H 'X-Key: ci' | grep -q '"ok":true'
          curl -fsS localhost:8080/ | grep -q ServerWatch
          echo "simulator OK"
      - name: Agent log
        if: always()
        run: cat agent.log || true

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    strategy:
      fail-fast: false
      matrix:
        board: [devkit, walle]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware
          DEFAULTS="sdkconfig.defaults"
          if [ "${{ matrix.board }}" = "walle" ]; then DEFAULTS="sdkconfig.defaults;sdkconfig.walle"; fi
          idf.py -D SDKCONFIG_DEFAULTS="$DEFAULTS" set-target esp32s3
          grep SW_BOARD sdkconfig
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            firmware/build/serverwatch_beacon.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
