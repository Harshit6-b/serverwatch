<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6574"/>
    </marker>
  </defs>
  <rect width="880" height="330" rx="16" fill="#0f131a"/>

  <!-- Windows server -->
  <rect x="24" y="26" width="368" height="278" rx="12" fill="#151b24" stroke="#2a3340"/>
  <text x="44" y="56" fill="#e7eaf0" font-size="15" font-weight="700">Windows PC being watched</text>

  <rect x="44" y="72" width="150" height="112" rx="10" fill="#1b2330" stroke="#33405a"/>
  <text x="58" y="96" fill="#6aa8ff" font-size="13" font-weight="700">WMI service</text>
  <text x="58" y="114" fill="#8792a2" font-size="11.5">Microsoft's WBEM /</text>
  <text x="58" y="129" fill="#8792a2" font-size="11.5">CIM Object Manager</text>
  <text x="58" y="152" fill="#aab6c8" font-size="11" font-family="Consolas,monospace">Win32_Processor</text>
  <text x="58" y="167" fill="#aab6c8" font-size="11" font-family="Consolas,monospace">Win32_Service …</text>

  <rect x="222" y="72" width="150" height="214" rx="10" fill="#1b2330" stroke="#33405a"/>
  <text x="236" y="96" fill="#2dd47e" font-size="13" font-weight="700">serverwatch.py</text>
  <text x="236" y="120" fill="#c9d1dc" font-size="11.5">thresholds</text>
  <text x="236" y="138" fill="#c9d1dc" font-size="11.5">3-in-a-row rule</text>
  <text x="236" y="156" fill="#c9d1dc" font-size="11.5">hysteresis</text>
  <text x="236" y="174" fill="#c9d1dc" font-size="11.5">trend prediction</text>
  <text x="236" y="192" fill="#c9d1dc" font-size="11.5">culprit process</text>
  <text x="236" y="210" fill="#c9d1dc" font-size="11.5">time-to-detect</text>
  <text x="236" y="238" fill="#8792a2" font-size="11">dashboard :8080</text>
  <text x="236" y="256" fill="#8792a2" font-size="11">CSV + report</text>
  <text x="236" y="274" fill="#8792a2" font-size="11">UDP discovery</text>

  <path d="M196 112 H220" stroke="#5b6574" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="44" y="210" fill="#8792a2" font-size="11">WQL query every 2 s</text>
  <text x="44" y="226" fill="#8792a2" font-size="11">event: service changed</text>
  <text x="44" y="242" fill="#8792a2" font-size="11">method: StartService()</text>
  <rect x="44" y="258" width="150" height="28" rx="8" fill="#241a1c" stroke="#5a2e33"/>
  <text x="58" y="277" fill="#f2545b" font-size="11.5">demo/inject.py faults</text>

  <!-- links -->
  <path d="M374 140 H560" stroke="#5b6574" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="400" y="130" fill="#8792a2" font-size="11.5">WiFi · HTTP + JSON</text>
  <text x="400" y="160" fill="#5b6574" font-size="11">GET /api/beacon every 1 s</text>
  <text x="400" y="176" fill="#5b6574" font-size="11">POST /api/ack, /api/fix</text>

  <path d="M374 250 H560" stroke="#5b6574" stroke-width="2" marker-end="url(#a)"/>
  <text x="400" y="242" fill="#8792a2" font-size="11.5">Telegram alert</text>

  <!-- beacon -->
  <rect x="562" y="26" width="294" height="190" rx="12" fill="#151b24" stroke="#2a3340"/>
  <text x="582" y="56" fill="#e7eaf0" font-size="15" font-weight="700">ESP32-S3 beacon</text>
  <rect x="582" y="70" width="128" height="68" rx="4" fill="#070b10" stroke="#33405a"/>
  <text x="590" y="88" fill="#82dcff" font-size="10" font-family="Consolas,monospace">CPU ████████ 97%</text>
  <text x="590" y="104" fill="#82dcff" font-size="10" font-family="Consolas,monospace">MEM ████     48%</text>
  <text x="590" y="120" fill="#82dcff" font-size="10" font-family="Consolas,monospace">DSK ████   46%fr</text>
  <circle cx="742" cy="92" r="11" fill="#f2545b"/>
  <text x="762" y="96" fill="#c9d1dc" font-size="11.5">status LED</text>
  <circle cx="742" cy="122" r="9" fill="#2a3340" stroke="#5b6574"/>
  <text x="762" y="126" fill="#c9d1dc" font-size="11.5">ACK / hold = FIX</text>
  <text x="582" y="164" fill="#8792a2" font-size="11.5">No reply 3 times → SERVER DOWN</text>
  <text x="582" y="182" fill="#8792a2" font-size="11.5">No WiFi → says so, never blames the server</text>
  <text x="582" y="200" fill="#5b6574" font-size="11">ESP-IDF v5.5 · esp_lcd · RMT · cJSON</text>

  <!-- phone -->
  <rect x="562" y="232" width="294" height="72" rx="12" fill="#151b24" stroke="#2a3340"/>
  <text x="582" y="260" fill="#e7eaf0" font-size="14" font-weight="700">Phone</text>
  <text x="582" y="282" fill="#8792a2" font-size="11">🔴 CRITICAL on LAB-PC: CPU 97% (cpu_burn)</text>
</svg>
